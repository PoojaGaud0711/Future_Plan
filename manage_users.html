<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Customers — Vrinda Wellness Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            forest: { 50:'#F0F7F4',100:'#D9EDE2',200:'#B3DBC5',300:'#7FC4A0',400:'#4BA87A',500:'#2D8A5E',600:'#1B6B47',700:'#1B4332',800:'#153628',900:'#0E2A1E' },
          },
          fontFamily: { body:['Inter','system-ui','sans-serif'] },
        }
      }
    }
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#F3F4F6;color:#1a1a1a}
    .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;color:rgba(0,0,0,.5);cursor:pointer;transition:all .2s ease;margin-bottom:4px}
    .sidebar-link:hover{background:rgba(27,67,50,.04);color:#1B4332}
    .sidebar-link.active{background:#1B4332;color:white;box-shadow:0 4px 12px rgba(27,67,50,.2)}
    .sidebar-link i{width:20px;text-align:center;font-size:15px}
    .admin-table{width:100%;border-collapse:separate;border-spacing:0}
    .admin-table th{text-align:left;padding:12px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:rgba(0,0,0,.4);background:#F9FAFB;border-bottom:1px solid rgba(0,0,0,.05)}
    .admin-table td{padding:16px;font-size:13px;border-bottom:1px solid rgba(0,0,0,.04);vertical-align:middle}
    .admin-table tbody tr{background:white;transition:all .2s ease}
    .admin-table tbody tr:hover{background:#F0F7F4}
    
    /* Toggle Switch */
    .toggle-switch{position:relative;width:40px;height:22px;background:#CBD5E1;border-radius:11px;cursor:pointer;transition:background .3s ease}
    .toggle-switch.active{background:#1B4332}
    .toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:white;border-radius:50%;transition:transform .3s ease;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .toggle-switch.active .toggle-knob{transform:translateX(18px)}

    .toast{transform:translateY(20px);opacity:0;transition:all .4s ease;position:fixed;bottom:24px;right:24px;z-index:100}
    .toast.show{transform:translateY(0);opacity:1}
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-white border-r border-gray-100 flex-shrink-0 hidden lg:flex flex-col">
    <div class="p-6 border-b border-gray-100">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center bg-forest-700"><span class="font-bold text-white text-sm">V</span></div>
        <div><div class="font-semibold text-[15px] text-forest-700 leading-tight">Vrinda</div><div class="text-[10px] font-medium tracking-widest uppercase text-forest-500 -mt-0.5">Admin Panel</div></div>
      </a>
    </div>
    <nav class="flex-1 p-4 overflow-y-auto">
      <a href="index.html" class="sidebar-link"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="prescriptions.html" class="sidebar-link"><i class="fas fa-file-prescription"></i> Rx Verification</a>
      <a href="orders.html" class="sidebar-link"><i class="fas fa-box-open"></i> All Orders</a>
      <a href="products.html" class="sidebar-link"><i class="fas fa-pills"></i> Products</a>
      <a href="users.html" class="sidebar-link active"><i class="fas fa-users"></i> Customers</a>
    </nav>
    <div class="p-4 m-4 rounded-xl" style="background:#F0F7F4">
      <p class="text-xs font-semibold mb-1" style="color:#153628">Logged in as:</p>
      <p class="text-sm font-bold" style="color:#1B4332">Dr. Aarti Mehta</p>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <div class="flex-1 flex flex-col overflow-hidden">
    
    <!-- TOP BAR -->
    <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
      <div class="flex items-center gap-4">
        <button class="lg:hidden text-gray-500"><i class="fas fa-bars text-lg"></i></button>
        <h1 class="text-base font-bold" style="color:#153628">Customer Management</h1>
      </div>
      <div class="flex items-center border rounded-lg px-3 h-9 w-64" style="border-color:rgba(0,0,0,.08)">
        <i class="fas fa-search text-xs mr-2 text-gray-300"></i>
        <input type="text" placeholder="Search name, email, phone..." class="flex-1 bg-transparent text-sm focus:outline-none">
      </div>
    </header>

    <!-- SCROLLABLE CONTENT -->
    <main class="flex-1 overflow-y-auto p-6">
      
      <!-- Stats Row -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-xl p-5 border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-forest-50 flex items-center justify-center"><i class="fas fa-users text-lg" style="color:#1B4332"></i></div>
          <div><p class="text-2xl font-bold" style="color:#153628">1,240</p><p class="text-[10px] uppercase tracking-wider font-semibold text-gray-400">Total Users</p></div>
        </div>
        <div class="bg-white rounded-xl p-5 border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-green-50 flex items-center justify-center"><i class="fas fa-user-check text-lg text-green-600"></i></div>
          <div><p class="text-2xl font-bold" style="color:#153628">1,235</p><p class="text-[10px] uppercase tracking-wider font-semibold text-gray-400">Active</p></div>
        </div>
        <div class="bg-white rounded-xl p-5 border border-gray-100 flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center"><i class="fas fa-user-slash text-lg text-red-500"></i></div>
          <div><p class="text-2xl font-bold" style="color:#153628">5</p><p class="text-[10px] uppercase tracking-wider font-semibold text-gray-400">Blocked</p></div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Contact</th>
                <th>Joined</th>
                <th>Orders</th>
                <th>Total Spent</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="user-table-body">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast bg-white rounded-xl shadow-2xl border border-gray-100 px-5 py-4 flex items-center gap-3" style="display:none">
    <div id="toast-icon" class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background:#DCFCE7"><i class="fas fa-check text-sm" style="color:#166534"></i></div>
    <div><div id="toast-title" class="text-sm font-bold" style="color:#153628">Status Updated!</div><div id="toast-msg" class="text-xs" style="color:rgba(0,0,0,.45)">User can no longer log in.</div></div>
  </div>

  <script>
    // Mock Users Data
    let users = [
      { id: 1, name: 'Pooja Gaud', email: 'pooja@vrinda.com', phone: '+91 98765 43210', joined: 'Jan 10, 2025', orders: 15, spent: 4520, active: true, avatar: 'PG' },
      { id: 2, name: 'Rahul Sharma', email: 'rahul.s@gmail.com', phone: '+91 99673 78987', joined: 'Jan 12, 2025', orders: 2, spent: 860, active: true, avatar: 'RS' },
      { id: 3, name: 'Anjali Desai', email: 'anjali.d@outlook.com', phone: '+91 88765 12345', joined: 'Dec 25, 2024', orders: 28, spent: 12450, active: true, avatar: 'AD' },
      { id: 4, name: 'Fraud User', email: 'fake@scam.com', phone: '+91 00000 00000', joined: 'Jan 14, 2025', orders: 1, spent: 0, active: false, avatar: 'FU' },
    ];

    const tbody = document.getElementById('user-table-body');

    function renderUsers() {
      tbody.innerHTML = '';
      users.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0" style="background:${u.active ? '#1B4332' : '#94A3B8'}">${u.avatar}</div>
              <div>
                <p class="font-semibold text-sm" style="color:#153628">${u.name}</p>
                <p class="text-[11px] text-gray-400">${u.email}</p>
              </div>
            </div>
          </td>
          <td class="text-xs text-gray-600">${u.phone}</td>
          <td class="text-xs text-gray-500">${u.joined}</td>
          <td class="font-semibold" style="color:#153628">${u.orders}</td>
          <td class="font-semibold" style="color:#1B4332">₹${u.spent.toLocaleString('en-IN')}</td>
          <td>
            <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${u.active ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-600'}">
              ${u.active ? 'Active' : 'Blocked'}
            </span>
          </td>
          <td>
            <div class="flex items-center gap-3">
              <div class="toggle-switch ${u.active ? 'active' : ''}" onclick="toggleUserStatus(${u.id})">
                <div class="toggle-knob"></div>
              </div>
              <button class="text-xs font-semibold text-blue-600 hover:underline">View Orders</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleUserStatus(id) {
      const userIndex = users.findIndex(u => u.id === id);
      if(userIndex !== -1) {
        users[userIndex].active = !users[userIndex].active;
        const isNowActive = users[userIndex].active;
        
        renderUsers();
        
        if(isNowActive) {
          showToast('Account Activated', `${users[userIndex].name} can now log in and place orders.`, 'green');
        } else {
          showToast('Account Blocked', `${users[userIndex].name} has been blocked from the platform.`, 'red');
        }
      }
    }

    function showToast(title, msg, type) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-msg').textContent = msg;

      if(type === 'red') {
        icon.style.background = '#FEE2E2';
        icon.innerHTML = '<i class="fas fa-ban text-sm" style="color:#DC2626"></i>';
      } else {
        icon.style.background = '#DCFCE7';
        icon.innerHTML = '<i class="fas fa-check text-sm" style="color:#166534"></i>';
      }

      toast.style.display = 'flex';
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.style.display = 'none', 400);
      }, 3000);
    }

    // Init
    renderUsers();
  </script>
</body>
</html>
